model:
  batch: 32
  channels: 3
  height: 320
  width: 320

  max_batches: 30000
  momentum: 0.9
  decay: 0.0005

  adam:
    enabled: True
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8

  augmentation:
    enabled: True
    flip: True
    jitter: 0.2
    hue: 0.2
    saturation: 0.75
    exposure: 0.75

  early_stopping:
    enabled: True
    patience: 12
    threshold: 0.0001

  gradient_rescale:
    enabled: True
    threshold: 100.0

  gradient_clipping:
    enabled: True
    value: 100.0

  validation:
    enabled: True
    interval: 313
    confidence_threshold: 0.05
    iou_threshold: 0.5
    nms_threshold: 0.4

  save_weights_interval: 1250
  write_metrics_interval: 50

  learning_rate:
    burn_in:
      batches: 1000
      power: 4.0

    initial_learning_rate: 0.001
    policy: cosine_annealing

    cosine_annealing:
      min_learning_rate: 0.00001
      batches_per_cycle: 30001

    sigmoid:
      target_learning_rate: 0.00001
      factor: 5.0

    inverse:
      gamma: 0.00001
      power: 4

    stepped:
      steps: [ -1, 100, 20000, 30000 ]
      scales: [ 0.1, 10, 0.1, 0.1 ]

  layers:
    # Initial conv
    - type: conv
      activation: mish
      batch_normalize: True
      dilation: 1
      filters: 16
      kernel: 3
      pad: True
      stride: 1

    # Depthwise + pointwise block #1
    - type: conv
      filters: 16
      kernel: 3
      stride: 2
      pad: True
      groups: 16
      activation: mish
      batch_normalize: True

    - type: conv
      filters: 32
      kernel: 1
      stride: 1
      pad: False
      activation: mish
      batch_normalize: True

    # Depthwise + pointwise block #2
    - type: conv
      filters: 32
      kernel: 3
      stride: 2
      pad: True
      groups: 32
      activation: mish
      batch_normalize: True

    - type: conv
      filters: 64
      kernel: 1
      stride: 1
      pad: False
      activation: mish
      batch_normalize: True

    # Depthwise + pointwise block #3
    - type: conv
      filters: 64
      kernel: 3
      stride: 2
      pad: True
      groups: 64
      activation: mish
      batch_normalize: True

    # Residual refinement block at stride 8
    - type: conv
      filters: 64
      kernel: 3
      pad: True
      groups: 64
      activation: mish
      batch_normalize: True

    - type: shortcut
      from: -2
      activation: linear

    # Feature map retained for the small-object head (40x40)
    - type: conv
      filters: 64
      kernel: 3
      pad: True
      activation: mish
      batch_normalize: True

    # Downsample to a 20x20 feature map for medium/large objects
    - type: conv
      filters: 64
      kernel: 3
      stride: 2
      pad: True
      groups: 64
      activation: mish
      batch_normalize: True

    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: False
      activation: mish
      batch_normalize: True

    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      groups: 128
      activation: mish
      batch_normalize: True

    - type: shortcut
      from: -2
      activation: linear

    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True

    # Medium/large-object detection head
    - type: conv
      filters: 75
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: yolo
      mask: [ 3, 4, 5 ]
      anchors: [ 10,14, 23,27, 37,58, 81,82, 135,169, 344,319 ]
      num: 6
      ignore_thresh: 0.7
      truth_thresh: 1.0
      coord_scale: 1.0
      object_scale: 2.0
      noobject_scale: 0.1
      class_scale: 1.0
      log_interval: 50

    # Fuse coarse semantic features with the retained stride-8 feature map
    - type: route
      layers: [ -4 ]

    - type: conv
      filters: 64
      kernel: 1
      stride: 1
      pad: False
      activation: mish
      batch_normalize: True

    - type: upsample
      stride: 2

    - type: route
      layers: [ -1, 8 ]

    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      groups: 128
      activation: mish
      batch_normalize: True

    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: False
      activation: mish
      batch_normalize: True

    # Small-object detection head
    - type: conv
      filters: 75
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: yolo
      mask: [ 0, 1, 2 ]
      anchors: [ 10,14, 23,27, 37,58, 81,82, 135,169, 344,319 ]
      num: 6
      ignore_thresh: 0.7
      truth_thresh: 1.0
      coord_scale: 1.0
      object_scale: 2.0
      noobject_scale: 0.1
      class_scale: 1.0
      log_interval: 50
