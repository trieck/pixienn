model:
  batch: 2
  subdivisions: 1
  channels: 3
  height: 64
  width: 64
  max_batches: 50
  momentum: 0.9
  decay: 0.0005

  adam:
    enabled: True
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8

  augmentation:
    enabled: False

  validation:
    enabled: False

  gradient_rescale:
    enabled: True
    threshold: 100.0

  gradient_clipping:
    enabled: False

  save_weights_interval: 25
  write_metrics_interval: 10

  learning_rate:
    initial_learning_rate: 0.001
    policy: constant

  layers:
    - type: conv
      filters: 16
      kernel: 3
      stride: 2
      pad: True
      activation: leaky
      batch_normalize: True

    - type: conv
      filters: 32
      kernel: 3
      stride: 2
      pad: True
      activation: leaky
      batch_normalize: True

    - type: conv
      filters: 32
      kernel: 3
      stride: 1
      pad: True
      activation: leaky
      batch_normalize: True

    # VOC: 20 center heatmaps + 2 size maps + 2 center-offset maps.
    - type: conv
      filters: 24
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: centernet
      focal_alpha: 2.0
      focal_beta: 4.0
      heatmap_bias: -2.19
      size_weight: 0.1
      max_detections: 50
