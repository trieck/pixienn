      pad: True
      filters: 1024
      activation: leaky

    - type: conv
      kernel: 1
      stride: 1
      pad: True
      filters: 255
      activation: linear

    - type: yolo
      mask: [ 6, 7, 8 ]
      anchors: [ 10, 13, 16, 30, 33, 23, 30, 61, 62, 45, 59, 119, 116, 90, 156, 198, 373, 326 ]
      classes: 80
      num: 9
      jitter: 0.3
      ignore_thresh: 0.7
      truth_thresh: 1.0
      coord_scale: 1.0
      # Background locations are dense; normalize their total gradient to
      # the sparse positive-target count during scratch training.
      object_scale: 1.0
      noobject_scale: 1.0
      obj_normalizer: 1.0
      normalize_noobject: True
      class_scale: 1.0
      # Each object has one positive class and 79 negative classes. Balance
      # the negative class terms during scratch training so class confidence
      # does not collapse before the shared features become useful.
      normalize_class: True
      random: True
      log_interval: 50

