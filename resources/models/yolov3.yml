model:

  # Effective batch 64, with 8 images resident on the GPU at a time.
  batch: 64
  subdivisions: 8
  width: 416
  height: 416
  channels: 3

  max_batches: 500000
  save_weights_interval: 100
  write_metrics_interval: 50

  momentum: 0.9
  decay: 0.0001

  adam:
    # SGD experiment: retain the section for reproducible Adam branches, but
    # train this branch with momentum SGD.
    enabled: False
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8

  augmentation:
    enabled: True
    flip: True
    jitter: 0.3
    saturation: 1.3
    exposure: 1.3
    hue: 0.05

  gradient_rescale:
    enabled: True
    threshold: 100.0

  gradient_clipping:
    enabled: True
    value: 10.0

  validation:
    enabled: True
    interval: 2500
    batches: 500
    threshold: 0.1
    ap_confidence_threshold: 0.001

  learning_rate:
    initial_learning_rate: 0.00025
    policy: constant

    sigmoid:
      target_learning_rate: 0.000005
      factor: 8.0

    burn_in:
      batches: 0
      power: 4.0

    inverse:
      gamma: 0.0001
      power: 1

    smooth_stepped:
      steps: [ 10, 25, 50, 75, 90, 100, 200, 300 ]
      targets: [ 0.00002, 0.00004, 0.00006, 0.00008, 0.00009, 0.0001, 0.0005, 0.001 ]

    stepped:
      steps: [ 400000, 450000 ]
      scales: [ 0.1, 0.1 ]

  layers:
    - type: conv
      batch_normalize: True
      filters: 32
      kernel: 3
      stride: 1
      pad: True
      activation: leaky

    - type: conv
      batch_normalize: True
      filters: 64
      kernel: 3
      stride: 2
      pad: True
      activation: leaky

    - type: conv
      batch_normalize: True
      filters: 32
      kernel: 1
      stride: 1
      pad: True
      activation: leaky

    - type: conv
      batch_normalize: True
      filters: 64
      kernel: 3
      stride: 1
      pad: True
      activation: leaky

    - type: shortcut
      from: -3
      activation: linear

    - type: conv
      batch_normalize: True
      filters: 128
      kernel: 3
      stride: 2
      pad: True
      activation: leaky

    - type: conv
      batch_normalize: True
      filters: 64
      kernel: 1
      stride: 1
      pad: True
      activation: leaky

    - type: conv
      batch_normalize: True
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: leaky

    - type: shortcut
      from: -3
      activation: linear

    - type: conv
      batch_normalize: True
      filters: 64
      kernel: 1
      stride: 1
      pad: True
      activation: leaky

    - type: conv
      batch_normalize: True
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: leaky

    - type: shortcut
      from: -3
      activation: linear

    - type: conv
      batch_normalize: True
      filters: 256
      kernel: 3
      stride: 2
      pad: True
      activation: leaky

    - type: conv
      batch_normalize: True
      filters: 128
      kernel: 1
      stride: 1
      pad: True
      activation: leaky

    - type: conv
      batch_normalize: True
      filters: 256
      kernel: 3
      stride: 1
