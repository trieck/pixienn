model:
  # Small CPU-first experiment: a 320 x 320 image becomes a 20 x 20 token
  # grid before attention, keeping the quadratic attention buffer manageable.
  batch: 1
  subdivisions: 1
  channels: 3
  height: 320
  width: 320
  # This run deliberately trains long enough to memorize one image.
  max_batches: 500
  momentum: 0.9
  decay: 0.0005

  adam:
    # Keep the CUDA smoke run on the same SGD-style update path as the CPU
    # reference layers; CUDA convolution otherwise switches to Adam.
    enabled: False
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8

  augmentation:
    enabled: False

  validation:
    enabled: True
    interval: 50
    confidence_threshold: 0.05
    ap_confidence_threshold: 0.001
    iou_threshold: 0.5
    nms_threshold: 0.4

  early_stopping:
    enabled: False

  gradient_rescale:
    enabled: True
    threshold: 100.0

  gradient_clipping:
    enabled: True
    value: 10.0

  save_weights_interval: 50
  max_checkpoints: 3
  write_metrics_interval: 5

  learning_rate:
    initial_learning_rate: 0.0001
    policy: constant

  layers:
    # Compact convolutional stem. The 20 x 20 feature map provides 400
    # spatial tokens for the attention block.
    - type: conv
      filters: 32
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 64
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 96
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 128
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True

    # Transformer encoder block: location signal, four attention heads,
    # residual path, normalization, feed-forward expansion, residual path.
    - type: positional-encoding
    - type: self-attention
      heads: 4
    - type: shortcut
      from: -2
      activation: linear
    - type: layernorm
    - type: conv
      filters: 256
      kernel: 1
      stride: 1
      pad: False
      activation: mish
    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: False
      activation: linear
    - type: shortcut
      from: -4
      activation: linear

    # Decode to a stride-4 CenterNet prediction grid.
    - type: upsample
      stride: 2
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
    - type: upsample
      stride: 2
    - type: conv
      filters: 64
      kernel: 3
      stride: 1
      pad: True
      activation: mish
    - type: conv
      filters: 84
      kernel: 1
      stride: 1
      pad: False
      activation: linear
    - type: centernet
      focal_alpha: 2.0
      focal_beta: 4.0
      heatmap_bias: -2.19
      size_weight: 0.1
      max_detections: 100
