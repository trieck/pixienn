model:
  batch: 8
  subdivisions: 1
  channels: 3
  height: 512
  width: 512
  max_batches: 64000
  momentum: 0.9
  decay: 0.001

  adam:
    enabled: False
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8

  augmentation:
    enabled: True
    flip: True
    jitter: 0.2
    saturation: 1.2
    exposure: 1.2
    hue: 0.05

  validation:
    enabled: True
    interval: 500
    confidence_threshold: 0.3
    ap_confidence_threshold: 0.001
    iou_threshold: 0.5
    nms_threshold: 0.4
    gallery:
      enabled: True
      interval: 1

  early_stopping:
    enabled: False
    patience: 10
    threshold: 0.0001

  gradient_rescale:
    enabled: True
    threshold: 100.0

  gradient_clipping:
    enabled: True
    value: 10.0

  save_weights_interval: 1000
  max_checkpoints: 5
  write_metrics_interval: 50

  learning_rate:
    initial_learning_rate: 0.001
    policy: reduce_on_plateau

    reduce_on_plateau:
      factor: 0.8
      patience: 3
      threshold: 0.003
      cooldown: 1
      min_learning_rate: 0.0000001
      smoothing: 3

  layers:
    - type: conv
      filters: 64
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True

    - type: conv
      filters: 128
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True

    # Darknet-style residual stage at stride 4.
    - type: conv
      filters: 64
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 64
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear

    # Stage 256, stride 8.
    - type: conv
      filters: 256
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 256
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 256
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 256
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 256
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear

    # Stage 512, stride 16.
    - type: conv
      filters: 512
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 256
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 512
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 256
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 512
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 256
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 512
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 256
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 512
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear

    # Stage 1024, stride 32.
    - type: conv
      filters: 1024
      kernel: 3
      stride: 2
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 512
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 1024
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 512
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 1024
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear
    - type: conv
      filters: 512
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 1024
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: shortcut
      from: -3
      activation: linear

    # Transformer enhancement at the stride-32 bottleneck.  Attention sees
    # the whole 16 x 16 feature map, then the residual feed-forward path
    # returns the context-enriched representation to the CenterNet pyramid.
    - type: conv
      filters: 256
      kernel: 1
      stride: 1
      pad: False
      activation: mish
      batch_normalize: True
    - type: positional-encoding
    # Normalize before Q/K/V projection so attention scores remain finite
    # while the convolutional backbone is still learning.
    - type: layernorm
    - type: self-attention
      heads: 8
    - type: shortcut
      from: -2
      activation: linear
    - type: layernorm
    - type: conv
      filters: 512
      kernel: 1
      stride: 1
      pad: False
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 256
      kernel: 1
      stride: 1
      pad: False
      activation: linear
    - type: shortcut
      from: -4
      activation: linear

    # Top-down pyramid: 32 -> 16 -> 8 -> 4 pixel strides.
    - type: conv
      filters: 512
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: upsample
      stride: 2
    - type: route
      layers: [ -1, 33 ]
    - type: conv
      filters: 512
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 256
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: upsample
      stride: 2
    - type: route
      layers: [ -1, 20 ]
    - type: conv
      filters: 256
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: upsample
      stride: 2
    - type: route
      layers: [ -1, 7 ]
    - type: conv
      filters: 256
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True

    # Decoupled CenterNet head: separate local feature processing for the
    # heatmap, size, and offset predictions before concatenation.
    - type: route
      layers: [ 65 ]
    - type: conv
      filters: 256
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 1
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: route
      layers: [ 65 ]
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 2
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: route
      layers: [ 65 ]
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 2
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: route
      layers: [ 68, 71, 74 ]

    - type: centernet
      focal_alpha: 2.0
      focal_beta: 4.0
      heatmap_bias: -4.6
      size_weight: 0.75
      max_detections: 100
    - type: route
      layers: [ 60 ]
    - type: conv
      filters: 128
      kernel: 1
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: upsample
      stride: 2

    - type: route
      layers: [ -1, 65 ]
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True

    - type: route
      layers: [ 80 ]
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 1
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: route
      layers: [ 80 ]
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 2
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: route
      layers: [ 80 ]
    - type: conv
      filters: 128
      kernel: 3
      stride: 1
      pad: True
      activation: mish
      batch_normalize: True
    - type: conv
      filters: 2
      kernel: 1
      stride: 1
      pad: False
      activation: linear

    - type: route
      layers: [ 84, 87, 90 ]
    - type: centernet
      focal_alpha: 2.0
      focal_beta: 4.0
      heatmap_bias: -4.6
      size_weight: 0.75
      max_detections: 100
