      # Width and height must remain raw logits for exponential decoding.
      activation: linear

    - type: yolo
      log_interval: 50
      mask: [ 0, 1, 2 ]
      # Official YOLOv7 anchors scaled from its 640 training size to 416.
      anchors: [ 8, 10, 12, 23, 26, 18, 23, 49, 49, 36, 47, 95, 92, 72, 125, 158, 298, 261 ]
      num: 9
      jitter: 0.1
      ignore_thresh: 0.7
      truth_thresh: 1
      coord_scale: 1.0
      object_scale: 1.0
      noobject_scale: 1.0
      class_scale: 1.0

