model:
  batch: 1
  subdivisions: 1
  width: 416
  height: 416
  channels: 3

  max_batches: 2000

  momentum: 0.9
  decay: 0.0005

  adam:
    enabled: True
    beta1: 0.9
    beta2: 0.999
    epsilon: 1e-8

  augmentation:
    enabled: True
    flip: True
    jitter: 0.2
    saturation: 1.5
    exposure: 1.5
    hue: 0.1

  early_stopping:
    enabled: True
    patience: 10
    threshold: 0.0001

  gradient_rescale:
    enabled: True
    threshold: 100.0

  gradient_clipping:
    enabled: False
    value: 100.0

  validation:
    enabled: True
    interval: 200
    batches: 10
    confidence_threshold: 0.05
    ap_confidence_threshold: 0.001
    iou_threshold: 0.5
    nms_threshold: 0.4

  save_weights_interval: 100
  write_metrics_interval: 50

  learning_rate:
    burn_in:
      batches: 1000
      power: 4.0

    initial_learning_rate: 0.001
    policy: stepped

    stepped:
      steps: [ 600000, 675000 ]
      scales: [ .1, .1 ]

  layers:
    - type: conv
      batch_normalize: True
      filters: 32
      kernel: 3
      stride: 1
      pad: True
      activation: swish

    - type: conv
      batch_normalize: True
      filters: 64
      kernel: 3
      stride: 2
      pad: True
      activation: swish

    - type: conv
      batch_normalize: True
      filters: 64
      kernel: 3
      stride: 1
      pad: True
      activation: swish

    - type: conv
      batch_normalize: True
      filters: 128
      kernel: 3
      stride: 2
      pad: True
      activation: swish

    - type: conv
      batch_normalize: True
      filters: 64
      kernel: 1
      stride: 1
      pad: True
      activation: swish

    - type: route
      layers: [ -2 ]

