  # overfit diagnostic, not a meaningful generalization experiment.
  train-images: ../data/coco/val-1.txt
  train-labels: ../data/coco/labels/val2014
  val-images: ../data/coco/val-1.txt
  val-labels: ../data/coco/labels/val2014
